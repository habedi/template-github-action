name: 'Template GitHub Action'
description: 'A template for building custom GitHub Actions with TypeScript, Vitest, and pre-commit'
author: 'Hassan Abedi'

inputs:
  name:
    description: 'Name of the person or entity to greet'
    required: false
    default: 'World'
  greeting-prefix:
    description: 'Greeting prefix to prepend before the target name'
    required: false
    default: 'Hello'

outputs:
  greeting:
    description: 'The formatted greeting generated by the action'
  timestamp:
    description: 'The ISO 8601 timestamp recorded when the action was executed'

branding:
  icon: 'play-circle'
  color: 'blue'

runs:
  using: 'node20'
  main: 'dist/index.js'
