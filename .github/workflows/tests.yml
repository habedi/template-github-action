name: Run Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  action-test:
    name: Integration Test Action
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test action with default inputs
        id: test-default
        uses: ./

      - name: Verify default outputs
        shell: bash
        run: |
          if [ "${{ steps.test-default.outputs.greeting }}" != "Hello, World!" ]; then
            echo "Unexpected greeting output: ${{ steps.test-default.outputs.greeting }}"
            exit 1
          fi
          if [ -z "${{ steps.test-default.outputs.timestamp }}" ]; then
            echo "Timestamp output is missing"
            exit 1
          fi

      - name: Test action with custom inputs
        id: test-custom
        uses: ./
        with:
          name: 'CI Runner'
          greeting-prefix: 'Greetings'

      - name: Verify custom outputs
        shell: bash
        run: |
          if [ "${{ steps.test-custom.outputs.greeting }}" != "Greetings, CI Runner!" ]; then
            echo "Unexpected greeting output: ${{ steps.test-custom.outputs.greeting }}"
            exit 1
          fi
